<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="SRI RAM — CSE (AI) Student | Aspiring AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#0A0C10"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="240" rx="10" fill="url(#bg)"/>
  <rect width="1200" height="240" rx="10" fill="url(#grid)"/>
  <rect width="1200" height="240" rx="10" fill="none" stroke="#222938" stroke-width="1.5"/>

  <!-- Left Accent Cyan Bar -->
  <rect x="0" y="30" width="4" height="180" rx="2" fill="#00E5FF"/>

  <!-- Top Metadata Tag -->
  <g transform="translate(60, 52)">
    <circle cx="5" cy="5" r="4" fill="#00E5FF"/>
    <text x="20" y="9" fill="#64748B" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.5">CSE (AI) STUDENT // SATHYABAMA INSTITUTE OF SCIENCE &amp; TECHNOLOGY</text>
  </g>

  <!-- Name Headline -->
  <text x="60" y="112" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
    SRI RAM
  </text>

  <!-- Subtitle -->
  <text x="60" y="148" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500">
    CSE (AI) Student | Aspiring AI Engineer
  </text>

  <!-- Tagline -->
  <g transform="translate(60, 188)">
    <text x="0" y="0" fill="#00E5FF" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="13" font-weight="600">&gt;</text>
    <text x="20" y="0" fill="#38BDF8" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="13" font-weight="500">“Building projects, learning by doing.”</text>
  </g>

  <!-- Right Code Card Accent -->
  <g transform="translate(930, 48)">
    <rect width="210" height="144" rx="8" fill="#0D1017" stroke="#1E2533" stroke-width="1.2"/>
    <line x1="0" y1="28" x2="210" y2="28" stroke="#1E2533" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="3.5" fill="#EF4444" fill-opacity="0.7"/>
    <circle cx="28" cy="14" r="3.5" fill="#F59E0B" fill-opacity="0.7"/>
    <circle cx="40" cy="14" r="3.5" fill="#10B981" fill-opacity="0.7"/>
    <text x="56" y="18" fill="#4B5563" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10">developer.ts</text>

    <text x="16" y="54" fill="#00E5FF" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11">const</text>
    <text x="56" y="54" fill="#E2E8F0" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11">profile = {</text>

    <text x="26" y="74" fill="#64748B" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11">status:</text>
    <text x="80" y="74" fill="#34D399" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11">'Learning'</text>
    <text x="150" y="74" fill="#64748B" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11">,</text>

    <text x="26" y="94" fill="#64748B" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11">focus:</text>
    <text x="74" y="94" fill="#38BDF8" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11">'AI + Web'</text>
    <text x="144" y="94" fill="#64748B" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11">,</text>

    <text x="26" y="114" fill="#64748B" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11">base:</text>
    <text x="68" y="114" fill="#94A3B8" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11">'Chennai'</text>

    <text x="16" y="132" fill="#E2E8F0" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11">};</text>
  </g>
</svg>
