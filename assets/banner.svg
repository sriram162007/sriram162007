<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Sri Ram — CSE (AI) Student & Developer">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <linearGradient id="charcoal-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14171E"/>
      <stop offset="100%" stop-color="#0B0D11"/>
    </linearGradient>
    <pattern id="dot-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="240" rx="10" fill="url(#charcoal-bg)"/>
  <rect width="1200" height="240" rx="10" fill="url(#dot-grid)"/>
  <rect width="1200" height="240" rx="10" fill="none" stroke="#202632" stroke-width="1.5"/>

  <!-- Left Cyan Accent Indicator -->
  <rect x="0" y="32" width="4" height="176" rx="2" fill="#00E5FF"/>

  <!-- Metadata Tag -->
  <g class="mono" transform="translate(60, 56)">
    <circle cx="5" cy="5" r="4" fill="#00E5FF" fill-opacity="0.9"/>
    <text x="20" y="9" fill="#64748B" font-size="12.5" font-weight="600" letter-spacing="1.5">SATHYABAMA INSTITUTE OF SCIENCE &amp; TECHNOLOGY // B.E. CSE (AI)</text>
  </g>

  <!-- Main Headline -->
  <text class="sans" x="60" y="118" fill="#F8FAFC" font-size="46" font-weight="700" letter-spacing="-1">
    Sri Ram
  </text>

  <!-- Subtitle -->
  <text class="sans" x="60" y="156" fill="#94A3B8" font-size="17" font-weight="400" letter-spacing="-0.2">
    Software development, modern web applications, and AI-driven automation.
  </text>

  <!-- Bottom Monospace Code Bar -->
  <g class="mono" transform="translate(60, 196)">
    <text x="0" y="0" fill="#00E5FF" font-size="13" font-weight="600">&gt;</text>
    <text x="18" y="0" fill="#94A3B8" font-size="13">current_stack</text>
    <text x="125" y="0" fill="#475569" font-size="13">=</text>
    <text x="142" y="0" fill="#38BDF8" font-size="13">['React'</text>
    <text x="208" y="0" fill="#94A3B8" font-size="13">,</text>
    <text x="222" y="0" fill="#38BDF8" font-size="13">'Next.js'</text>
    <text x="295" y="0" fill="#94A3B8" font-size="13">,</text>
    <text x="310" y="0" fill="#38BDF8" font-size="13">'TypeScript'</text>
    <text x="408" y="0" fill="#94A3B8" font-size="13">,</text>
    <text x="422" y="0" fill="#38BDF8" font-size="13">'Firebase'</text>
    <text x="502" y="0" fill="#94A3B8" font-size="13">,</text>
    <text x="516" y="0" fill="#38BDF8" font-size="13">'Python'</text>
    <text x="585" y="0" fill="#94A3B8" font-size="13">,</text>
    <text x="600" y="0" fill="#38BDF8" font-size="13">'n8n']</text>
  </g>

  <!-- Clean Minimalist Status Badge on Right -->
  <g transform="translate(940, 72)" opacity="0.95">
    <rect width="200" height="96" rx="8" fill="#0F1218" stroke="#1F2633" stroke-width="1.2"/>
    <circle cx="20" cy="28" r="4" fill="#22C55E"/>
    <text class="mono" x="32" y="32" fill="#22C55E" font-size="11" font-weight="600">STATUS: ACTIVE</text>
    <text class="sans" x="20" y="60" fill="#CBD5E1" font-size="13" font-weight="500">Building &amp; Learning</text>
    <text class="mono" x="20" y="80" fill="#64748B" font-size="11">Chennai, India 📍</text>
  </g>
</svg>
