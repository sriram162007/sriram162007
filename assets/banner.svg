<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Sri Ram — AI Engineer and AI Automation Builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B19"/>
      <stop offset="0.5" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E1138"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .orbit { transform-origin: 970px 150px; animation: spin 22s linear infinite; }
      .orbit-rev { transform-origin: 970px 150px; animation: spin 15s linear infinite reverse; }
      .pulse-core { animation: pulse 3s ease-in-out infinite; }
      .node { animation: blink 2.2s ease-in-out infinite; }
      .n2 { animation-delay: .7s; } 
      .n3 { animation-delay: 1.4s; }
      .n4 { animation-delay: 2.1s; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: .45; transform: scale(0.98); } 50% { opacity: .95; transform: scale(1.03); } }
      @keyframes blink { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Background Base & Grid -->
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="18" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- AI & React Emblem on Right -->
  <circle cx="970" cy="150" r="145" fill="url(#glow)" class="pulse-core"/>

  <!-- Orbits -->
  <g class="orbit" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-opacity="0.85">
    <ellipse cx="970" cy="150" rx="115" ry="42"/>
    <ellipse cx="970" cy="150" rx="115" ry="42" transform="rotate(60 970 150)"/>
    <ellipse cx="970" cy="150" rx="115" ry="42" transform="rotate(120 970 150)"/>
  </g>

  <!-- Orbiting particles -->
  <g class="orbit-rev">
    <circle cx="1085" cy="150" r="6" fill="#C084FC"/>
    <circle cx="912" cy="52" r="5" fill="#38BDF8"/>
    <circle cx="912" cy="248" r="5" fill="#34D399"/>
  </g>

  <!-- Neural Core Network -->
  <g stroke="#94A3B8" stroke-opacity="0.5" stroke-width="1.5">
    <line x1="945" y1="130" x2="995" y2="130"/>
    <line x1="945" y1="130" x2="970" y2="170"/>
    <line x1="995" y1="130" x2="970" y2="170"/>
    <line x1="970" y1="170" x2="970" y2="200"/>
  </g>
  <circle cx="945" cy="130" r="6.5" fill="#38BDF8" class="node"/>
  <circle cx="995" cy="130" r="6.5" fill="#A855F7" class="node n2"/>
  <circle cx="970" cy="170" r="7.5" fill="#F472B6" class="node n3"/>
  <circle cx="970" cy="200" r="5.5" fill="#34D399" class="node n4"/>

  <!-- Typography Content -->
  <text x="70" y="88" fill="#94A3B8" font-size="16" font-weight="600" letter-spacing="4">HI, I'M</text>
  <text x="68" y="152" fill="#FFFFFF" font-size="62" font-weight="800" letter-spacing="-1">Sri Ram</text>
  <rect x="70" y="174" width="110" height="5" rx="2.5" fill="url(#accent)"/>
  
  <text x="70" y="218" fill="#F1F5F9" font-size="26" font-weight="700">
    AI Engineer <tspan fill="url(#textGrad)">| AI Automation Builder</tspan>
  </text>
  <text x="70" y="254" fill="#94A3B8" font-size="16.5" font-weight="400">
    Building AI-Powered Apps &amp; SaaS Projects  ·  React • Next.js • TypeScript • Firebase  ·  Chennai, India
  </text>
</svg>
