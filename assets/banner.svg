<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Sri Ram — Software Developer and AI Automation">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <!-- Subtle charcoal background -->
    <linearGradient id="charcoal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16181D"/>
      <stop offset="100%" stop-color="#0E1013"/>
    </linearGradient>
    <!-- Clean grid texture -->
    <pattern id="subtle-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="260" rx="12" fill="url(#charcoal)"/>
  <rect width="1200" height="260" rx="12" fill="url(#subtle-grid)"/>
  <rect width="1200" height="260" rx="12" fill="none" stroke="#252A34" stroke-width="1.5"/>

  <!-- Left Accent Bar -->
  <rect x="0" y="24" width="4" height="212" rx="2" fill="#00E5FF"/>

  <!-- Top Metadata / Monospace Tag -->
  <g class="mono" transform="translate(64, 58)">
    <circle cx="5" cy="5" r="4" fill="#00E5FF" fill-opacity="0.9"/>
    <text x="20" y="9" fill="#717D91" font-size="13" font-weight="500" letter-spacing="1.5">SRIRAM162007 // CSE (ARTIFICIAL INTELLIGENCE)</text>
  </g>

  <!-- Name Headline -->
  <text class="sans" x="64" y="126" fill="#F8FAFC" font-size="52" font-weight="700" letter-spacing="-1.5">
    Sri Ram
  </text>

  <!-- Subtitle -->
  <text class="sans" x="64" y="166" fill="#94A3B8" font-size="19" font-weight="400" letter-spacing="-0.2">
    Student developer building web applications and exploring AI automation.
  </text>

  <!-- Subtle Cyan Monospace Terminal Footer / Tech Focus -->
  <g class="mono" transform="translate(64, 212)">
    <text x="0" y="0" fill="#00E5FF" font-size="13" font-weight="600">&gt; stack:</text>
    <text x="75" y="0" fill="#64748B" font-size="13" font-weight="400">React · Next.js · TypeScript · Node.js · Firebase · Python</text>
  </g>

  <!-- Minimalist Geometric Graphic Accent on Right (No generic atom, just clean dev layout) -->
  <g transform="translate(920, 50)" opacity="0.85">
    <!-- Window frame -->
    <rect width="216" height="160" rx="8" fill="#13151A" stroke="#232834" stroke-width="1.5"/>
    <!-- Window header -->
    <line x1="0" y1="32" x2="216" y2="32" stroke="#232834" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="3.5" fill="#EF4444" fill-opacity="0.6"/>
    <circle cx="28" cy="16" r="3.5" fill="#F59E0B" fill-opacity="0.6"/>
    <circle cx="40" cy="16" r="3.5" fill="#10B981" fill-opacity="0.6"/>
    <text class="mono" x="60" y="20" fill="#4B5563" font-size="10">profile.config.ts</text>

    <!-- Code skeleton lines -->
    <text class="mono" x="16" y="60" fill="#00E5FF" font-size="11">const</text>
    <text class="mono" x="58" y="60" fill="#E2E8F0" font-size="11">dev = {</text>
    
    <text class="mono" x="28" y="82" fill="#64748B" font-size="11">focus:</text>
    <text class="mono" x="80" y="82" fill="#38BDF8" font-size="11">'AI &amp; Web'</text>
    <text class="mono" x="146" y="82" fill="#64748B" font-size="11">,</text>
    
    <text class="mono" x="28" y="104" fill="#64748B" font-size="11">status:</text>
    <text class="mono" x="85" y="104" fill="#34D399" font-size="11">'Building'</text>
    <text class="mono" x="156" y="104" fill="#64748B" font-size="11">,</text>

    <text class="mono" x="28" y="126" fill="#64748B" font-size="11">location:</text>
    <text class="mono" x="100" y="126" fill="#94A3B8" font-size="11">'Chennai'</text>
    
    <text class="mono" x="16" y="146" fill="#E2E8F0" font-size="11">};</text>
  </g>
</svg>
